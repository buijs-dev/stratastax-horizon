name: Pages

# Builds stratastax.dev and deploys it to GitHub Pages: on every push to main, and when stratastax-design
# changes (design-updated). The documentation, docs.stratastax.dev, is stratastax-docs.
on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ design-updated ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: buijs-dev/ci-templates/.github/workflows/astro-pages.yml@main
    with:
      sources: |
        buijs-dev/stratastax-design@main:_sources/stratastax-design
      prebuild: npm run sync
